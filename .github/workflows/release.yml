name: Release

# Publishes when the version in package.json has no git tag yet (v<version>).
# A push to main with an already released version does nothing here (CI still runs).
#
# Secrets (Settings > Secrets and variables > Actions):
#   VSCE_PAT  Azure DevOps token, scope Marketplace > Manage, all accessible organizations
#   OVSX_PAT  open-vsx.org access token
# Without VSCE_PAT nothing is published or tagged, so the version stays pending until the secret
# exists. Without OVSX_PAT, Open VSX is skipped (Marketplace and the GitHub release still happen).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released: nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new: publishing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      VSIX: kiro-relay-${{ needs.check.outputs.version }}.vsix
    steps:
      - id: secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set: v$VERSION is not published or tagged (it stays pending)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx vsce package --out "$VSIX"

      - name: Publish to the VS Code Marketplace
        if: steps.secrets.outputs.ready == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        if: steps.secrets.outputs.ready == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT is not set: skipping Open VSX."; exit 0; fi
          npx --yes ovsx@1.3.0 publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate

      - name: Tag and GitHub release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the CHANGELOG section of this version ("## <version> ..." up to the next "## ").
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Kiro Relay $VERSION" > notes.md
          prerelease=$(node -p "require('./package.json').preview ? '--prerelease' : ''")
          gh release create "v$VERSION" "$VSIX" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md $prerelease
